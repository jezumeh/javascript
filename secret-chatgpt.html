<!--Point of the edits is to display a message AND a score. chat gpt added script to deal with creating and alerting of final score. It also added way more condition statements to make sure only integers were being accepted as attempts in the quiz. That makes me curious if the the additional rules by chatgpt would allow for more than whole number (e.g. -1,...-5)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game | JJVJ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Secret Number Game</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="quotes.html">Quotes</a>
            <a href="secret-number-game.html">Secret Number Game</a>
            <a href="">Lab 3</a>
        </nav>
    </header>

    <main>
        <section id="secretNumberGame">
            <h2>Guess My Favorite Number!</h2>
            <p>Choose a whole number from 1 to 5.</p>

            <p id="message"></p>
            <p id="score"></p>

            <script>
                // Variable declarations
                var secretNumber = 3;
                var guess;
                var guessNumber;
                var score = 0;

                // Repeat the prompt until the input is valid
                do {
                    guess = prompt("Guess my favorite number from 1 to 5:");

                    if (
                        guess === null ||
                        guess.trim() === "" ||
                        !Number.isFinite(Number(guess)) ||
                        !Number.isInteger(Number(guess)) ||
                        Number(guess) < 1 ||
                        Number(guess) > 5
                    ) {
                        alert("Please enter a whole number from 1 to 5.");
                    }
                } while (
                    guess === null ||
                    guess.trim() === "" ||
                    !Number.isFinite(Number(guess)) ||
                    !Number.isInteger(Number(guess)) ||
                    Number(guess) < 1 ||
                    Number(guess) > 5
                );

                // Convert the valid input to a number
                guessNumber = Number(guess);

                // Compare the guess and determine the score
                if (guessNumber === secretNumber) {
                    score = 10;
                    document.getElementById("message").textContent =
                        "Hooray! You guessed correctly. Congratulations!";
                } else {
                    score = 0;
                    document.getElementById("message").textContent =
                        "So sorry! That was not the right answer.";
                }

                // Display the final score
                document.getElementById("score").textContent =
                    "Your final score is " + score + " points.";
            </script>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jesus Javier Vela Jr.</p>
    </footer>
</body>
</html>
